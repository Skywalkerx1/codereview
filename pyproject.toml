[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-loop"
version = "0.13.0"
description = "Multi-model code review loop: one agent builds, independent models review, a deterministic gate decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Superstar Telecom LLC" }]
keywords = ["code-review", "multi-agent", "llm", "ci", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
codereview = "codereview.cli:console_main"
reviewloop = "codereview.cli:console_main"

[project.urls]
Homepage = "https://gitlab.com/superstartelecom/codereview"
Issues = "https://gitlab.com/superstartelecom/codereview/-/issues"
Security = "https://gitlab.com/superstartelecom/codereview/-/blob/master/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]
