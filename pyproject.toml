[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-ai"
version = "0.9.2"
description = "Multi-model code review loop: one agent builds, independent models review, a deterministic gate decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Superstar Telecom LLC" }]
keywords = ["code-review", "multi-agent", "llm", "ci", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
codereview = "codereview.cli:main"
reviewloop = "codereview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
